      - 2 Demand


switch:
  - platform: template
    switches:
      sprsun_pc_wlaczenie_pompy_ciepla:
        friendly_name: "Turning on the heat pump"
        value_template: "{{ states('sensor.spr_parameter_marker_definition') | int(default=0) | bitwise_and(1) > 0 }}"
        turn_on:
          - service: modbus.write_register
            data:
              hub: SPRSUN
              unit: 1
              address: 0x0032
              value: >
                {% set reg = states.sensor.spr_parameter_marker_definition.state | int(default=0) %}
                {% set bit = 1 %}
                {{ reg | bitwise_or(2 ** (bit - 1)) }}
          - service: homeassistant.update_entity
            data:
              entity_id: sensor.spr_parameter_marker_definition
        turn_off:
          - service: modbus.write_register
            data:
              hub: SPRSUN
              unit: 1
              address: 0x0032
              value: >
                {% set reg = states.sensor.spr_parameter_marker_definition.state | int(default=0) %}
                {% set bit = 1 %}
                {{ reg | bitwise_and(65535 - (2 ** (bit - 1))) }}
          - service: homeassistant.update_entity
            data:
              entity_id: sensor.spr_parameter_marker_definition

template:
