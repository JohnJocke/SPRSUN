sensor:

  - platform: time_date
    display_options:
      - 'date_time'
      - 'time'
      - 'date'
      
  - platform: history_stats
    name: Compressor operating time 
    entity_id: binary_sensor.sprsun_pc_compressor
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
    
  - platform: history_stats
    name: Number of compressor starts 
    entity_id: binary_sensor.sprsun_pc_compressor
    state: "on"
    type: count
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"   
    
  - platform: filter
    name: Average COP
    entity_id: sensor.cop_do_sredniej
    filters:
      - filter: time_simple_moving_average
        window_size: "24:00"
        precision: 2
        
modbus:
  - name: "SPRSUN"
    delay: 5
    timeout: 5
    type: tcp
    host: 192.168.0.7
    port: 502
    
    climates:
      - name: P01 Heating setp
        slave: 1
        address: 0x00CC
        input_type: holding
        data_type: int16
        max_temp: 55
        min_temp: 10
        offset: 0
        precision: 1
        scale: 0.5
        target_temp_register: 0x00CC
        temp_step: 1.0
        temperature_unit: °C
        scan_interval: 60

      - name: P02 Cooling setp
        slave: 1
        address: 0x00CB
        input_type: holding
        data_type: int16
        max_temp: 30
        min_temp: 12
        offset: 0
        precision: 1
        scale: 0.5
