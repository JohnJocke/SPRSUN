switch:
  - platform: template
    switches:
      sprsun_pc_wlaczenie_pompy_ciepla:
        friendly_name: "Turning on the heat pump"
        value_template: "{{ states('sensor.parameter_marker_definition') | int(default=0) | bitwise_and(1) > 0 }}"
        turn_on:
          - service: modbus.write_register
            data:
              hub: SPRSUN
              unit: 1
              address: 0x0032
              value: >
                {% set reg = states.sensor.parameter_marker_definition.state | int(default=0) %}
                {% set bit = 1 %}
                {{ reg | bitwise_or(2 ** (bit - 1)) }}
          - service: homeassistant.update_entity
            data:
              entity_id: sensor.parameter_marker_definition
        turn_off:
          - service: modbus.write_register
            data:
              hub: SPRSUN
              unit: 1
              address: 0x0032
              value: >
                {% set reg = states.sensor.parameter_marker_definition.state | int(default=0) %}
                {% set bit = 1 %}
                {{ reg | bitwise_and(65535 - (2 ** (bit - 1))) }}
          - service: homeassistant.update_entity
            data:
              entity_id: sensor.parameter_marker_definition

  - binary_sensor:
# working_status_mark
    - name: SPRSUN Hotwater demand
      state: "{{ states('sensor.working_status_mark')| int(default=0) |int|bitwise_and(1) > 0 }}"
      icon: mdi:water-boiler-alert
    - name: SPRSUN Heating demand
      state: "{{ states('sensor.working_status_mark')| int(default=0) |int|bitwise_and(2) > 0 }}"
      icon: mdi:water-boiler
    - name: SPRSUN With or without heating
      state: "{{ states('sensor.working_status_mark')| int(default=0) |int|bitwise_and(4) > 0 }}"
      icon: mdi:water-boiler-alert
    - name: SPRSUN With or without cooling
      state: "{{ states('sensor.working_status_mark')| int(default=0) |int|bitwise_and(8) > 0 }}"
      icon: mdi:timer-off
    - name: SPRSUN Antilegionella on
      state: "{{ states('sensor.working_status_mark')| int(default=0) |int|bitwise_and(16) > 0 }}"
      icon: mdi:account-cancel
    - name: SPRSUN Cooling demand
      state: "{{ states('sensor.working_status_mark')| int(default=0) |int|bitwise_and(32) > 0 }}"
      icon: mdi:connection
    - name: SPRSUN Alarm downtime
      state: "{{ states('sensor.working_status_mark')| int(default=0) |int|bitwise_and(64) > 0 }}"
      icon: mdi:water-boiler-off
    - name: SPRSUN Defrost
      state: "{{ states('sensor.working_status_mark')| int(default=0) |int|bitwise_and(128) > 0 }}"
      icon: mdi:hand-front-right
      
# parameter_marker_definition
    - name: SPRSUN 0-OFF，1-ON
      state: "{{ states('sensor.parameter_marker_definition')| int(default=0) |int|bitwise_and(1) > 0 }}"
    - name: SPRSUN MV mode：0-Auto，1- manu
