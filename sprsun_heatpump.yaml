        min_temp: 10
        offset: 0
        precision: 1
        scale: 0.5
        target_temp_register: 0x00CA
        temp_step: 1.0
        temperature_unit: °C
        scan_interval: 60

      - name: SPR P03 Temp.diff
        slave: 1
        address: 0x00C6
        input_type: holding
        data_type: int16
        max_temp: 18
        min_temp: 2
        offset: 0
        precision: 1
        scale: 1
        target_temp_register: 0x00C6
        temp_step: 1.0
        scan_interval: 60 
