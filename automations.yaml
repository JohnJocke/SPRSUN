
#####################
- id: sprsun_pc_wybieramy_tryb_pracy_pompy_obiegowej_19e
  alias: SPR selecting the operating mode of the circulation pump
  trigger:
    platform: state
    entity_id: input_select.sprsun_pc_g02_pump_work_0_interval_1_normal_2_demand_19e
    id: select
    to:
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: input
      sequence:
      - variables:
          values:
            '0': 0 Interval
            '1': 1 Normal
            '2': 2 Demand
      - service: input_select.select_option
        target:
          entity_id: input_select.sprsun_pc_g02_pump_work_0_interval_1_normal_2_demand_19e
        data:
          option: '{{ values.get(trigger.to_state.state) }}'
    - conditions:
      - condition: trigger
        id: select
      sequence:
      - service: modbus.write_register
        data_template:
          address: 414
          slave: 1
          hub: Sprsun PC
          value: '{{ trigger.to_state.state[0] | int(0)  }}'
- id: sprsun_pc_wybieramy_tryb_pracy_kompresora_190
  alias: SPR selecting the compressor operating mode
  trigger:
  - platform: state
    entity_id: input_select.sprsun_pc_tryb_pracy_kompresora_190
    id: select
    to:
    
  - platform: state
    entity_id: sensor.spr_p07_fan_mode
    id: input
    to:
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: input
      sequence:
      - variables:
          values:
            '0': 0 Turbo
            '1': 1 ECO
            '2': 2 Sleep
            '3': 3 HI-COP
      - service: input_select.select_option
        target:
          entity_id: input_select.sprsun_pc_tryb_pracy_kompresora_190
        data:
          option: '{{ values.get(trigger.to_state.state) }}'
    - conditions:
      - condition: trigger
        id: select
      sequence:
      - service: modbus.write_register
        data_template:
          address: 400
          slave: 1
          hub: SPRSUN
          value: '{{ trigger.to_state.state[0] | int(0)  }}'

- id: sprsun_pc_wybieramy_tryb_pracy_p06_unit_mode_36
  alias: SPR selecting the unit operating mode
  trigger:
  - platform: state
    entity_id: input_select.sprsun_pc_tryb_pracy_p06_unit_mode_36
    id: select
    to:
    
  - platform: state
    entity_id: sensor.spr_p06_unit_mode
    id: input
    to:
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: input
      sequence:
      - variables:
          values:
            '0': 0 DHW
            '1': 1 Heating
            '2': 2 Cooling
            '3': 3 Heating and DHW
            '4': 4 Cooling and DHW
      - service: input_select.select_option
        target:
          entity_id: input_select.sprsun_pc_tryb_pracy_p06_unit_mode_36
        data:
          option: '{{ values.get(trigger.to_state.state) }}'
    - conditions:
      - condition: trigger
        id: select
      sequence:
      - service: modbus.write_register
        data_template:
          address: 54
          slave: 1
          hub: SPRSUN
          value: '{{ trigger.to_state.state[0] | int(0)  }}'
- id: sprsun_pc_nastawiony_czas_po_g03_start_internal_185
  alias: SPR setting the intervals for switching on the circulation pump
  trigger:
    platform: state
    entity_id: input_number.sprsun_pc_nastawiony_czas_po_g03_start_internal_185
  action:
    service: modbus.write_register
    data_template:
      address: 389
      hub: Sprsun PC
      unit: 1
      value: '{{ ((states(''input_number.sprsun_pc_nastawiony_czas_po_g03_start_internal_185'')
        | float) | multiply(1) | int) }}'
        
        
